# naos battery alerts, read by ~/.local/bin/naos-battery (changes apply on the next check)
# Levels are percentages. Alerts fire once per level while discharging and reset when you plug in.

WARN=20          # notification; bar text turns amber
LOW=10           # urgent notification; bar segment turns amber
CRITICAL=5       # urgent notification; bar segment turns red; then ACTION
ACTION=suspend   # what to do at CRITICAL: none | suspend | hibernate | poweroff
GRACE=60         # seconds to plug in before ACTION runs
FULL=95          # "you can unplug" notice while charging (0 = off)
INTERVAL=60      # seconds between checks (halved below LOW)
