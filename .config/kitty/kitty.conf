# naos · kitty.conf · nss theme
# Reload without restarting: ctrl+shift+F5

# ---- font (Nerd Font so nvim icons render)
font_family          FiraCode Nerd Font
font_size            12.0
# ligatures everywhere except under the cursor
disable_ligatures    cursor

# ---- window
window_padding_width 8
# see-through, needs picom
background_opacity   0.55
confirm_os_window_close 0
enable_audio_bell    no
# no screen flash
visual_bell_duration 0.0
# mark the tab instead
bell_on_tab          "🔔 "

# ---- cursor & selection
cursor_shape         beam
cursor               #66BDB3
cursor_text_color    #070B0F
selection_background #16302E
# keep syntax colours inside the selection
selection_foreground none
url_color            #A9B8FF
url_style            curly

# ---- tabs
tab_bar_style        powerline
tab_powerline_style  slanted
active_tab_background   #152027
active_tab_foreground   #66BDB3
inactive_tab_background #070B0F
inactive_tab_foreground #5C6B6A
tab_bar_background      #070B0F

# ---- borders between splits
active_border_color   #3A807A
inactive_border_color #1F2C33

# ---- nss colours
foreground           #E6ECEC
background           #070B0F

# black / bright black
color0               #0F161B
color8               #3A4A50

# red / bright red
color1               #FF6B6B
color9               #FF8F8F

# green / bright green
color2               #3FB27F
color10              #7FD6C7

# yellow / bright yellow (nss amber)
color3               #E0A63A
color11              #F2C46B

# blue / bright blue (nss periwinkle)
color4               #7F8FE0
color12              #A9B8FF

# magenta / bright magenta
color5               #B48EDB
color13              #C9B8FF

# cyan / bright cyan (nss teal)
color6               #3A807A
color14              #66BDB3

# white / bright white
color7               #8B979A
color15              #E6ECEC

# ---- remote shells
# Backspace/arrow problems over ssh come from the server not knowing kitty's terminal type.
# Connect with `kitten ssh host` (copies kitty's terminfo) instead of a backspace remap.
