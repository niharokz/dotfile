#
#  naos · picom.conf · nss theme
#  Compositor for xmonad: soft shadows, rounded corners, blur behind see-through windows, gentle fades.
#  Written for picom 10-12 (Debian 13 ships 12). Started once per session by xmonad (spawnOnce).
#

# ---- backend
backend = "glx";                 # GPU compositing; needed for blur and smooth corners
vsync = true;                    # no tearing
use-damage = true;               # only redraw what changed (saves battery)

# ---- fading
fading = true;
fade-in-step = 0.06;
fade-out-step = 0.06;
fade-delta = 8;                  # ms between fade steps
no-fading-openclose = false;

# ---- opacity
# kitty sets its own background_opacity, so it is not listed here (that would also dim the text).
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
inactive-opacity-override = false;
opacity-rule = [
  "95:class_g = 'dmenu'",
  "95:class_g = 'Dmenu'"
];

# ---- shadows (soft, dark, slightly below the window)
shadow = true;
shadow-radius = 18;
shadow-offset-x = -14;
shadow-offset-y = -10;
shadow-opacity = 0.45;
shadow-color = "#000000";
shadow-exclude = [
  "window_type = 'dock'",        # xmobar
  "window_type = 'desktop'",
  "class_g = 'dmenu'",
  "class_g = 'i3lock'",
  "_GTK_FRAME_EXTENTS@:c",       # GTK apps that draw their own shadow
  "class_g = 'firefox' && argb"
];

# ---- rounded corners (nss uses 10-16 px radii)
corner-radius = 10;
rounded-corners-exclude = [
  "window_type = 'dock'",        # keep xmobar square
  "window_type = 'desktop'",
  "class_g = 'dmenu'",
  "class_g = 'i3lock'"
];

# ---- blur behind see-through windows (kitty)
blur-method = "dual_kawase";
blur-strength = 5;
blur-background = true;
blur-background-frame = false;
blur-background-exclude = [
  "window_type = 'dock'",
  "window_type = 'desktop'",
  "class_g = 'dmenu'",
  "class_g = 'Dmenu'",
  "class_g = 'i3lock'",
  "_GTK_FRAME_EXTENTS@:c"
];

# ---- per window type
wintypes:
{
  tooltip       = { fade = true; shadow = false; opacity = 0.95; focus = true; };
  dock          = { shadow = false; clip-shadow-above = true; };
  dnd           = { shadow = false; };
  popup_menu    = { opacity = 0.97; };
  dropdown_menu = { opacity = 0.97; };
};
